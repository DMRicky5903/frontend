[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "Ricky", email = "Rickymo5903@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]==0.115.6",
    "numpy==2.1.3",
    "opencv-python==4.10.0.84",
    "pyserial>=3.5",
    "uvicorn[standard]==0.34.0",
    "websockets==14.1",
]

[project.scripts]
backend = "backend.web_server:main"
mcu = "backend.mcu_control:main"
docs-structure = "backend.generate_structure:generate"

[tool.fastapi]
entrypoint = "backend.web_server:app"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"


